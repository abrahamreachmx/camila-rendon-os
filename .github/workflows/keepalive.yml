# Supabase Free pausa un proyecto tras 7 días sin actividad. En oct-2026 lo pausó
# aunque este job llamaba a ping() cada 3 días: ping() es `select 'ok'` y no toca
# ninguna tabla, así que al parecer no cuenta. Ahora corre diario y además lee una
# tabla real. Usa la llave publicable, que es pública por diseño; nunca la secreta.
name: Keep-alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al RPC ping()
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /dev/stderr | grep -q '"ok"'
          echo "Supabase respondió ok."

      # Con RLS, anon recibe [] pero Postgres sí ejecuta la consulta sobre la tabla.
      - name: Leer una tabla real
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -sS -f "$SUPABASE_URL/rest/v1/campaigns?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
          echo
          echo "Lectura de campaigns ok."
